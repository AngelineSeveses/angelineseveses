# Netlify must build the Vite app and publish the output folder,
# otherwise it serves the raw source (index.html pointing at /src/main.tsx) and the page is blank.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for every route (e.g. /projects), let React Router handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
